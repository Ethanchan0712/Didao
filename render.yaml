# 「的道」Render Blueprint（可選）——喺 Render 手動建立 Web Service 亦可，唔一定要用呢個檔案
services:
  - type: web
    name: dikdou-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      # 持久磁碟：把資料庫寫入掛載路徑 /var/data，避免每次 deploy 重置
      - key: DB_PATH
        value: /var/data/taxi.db
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
